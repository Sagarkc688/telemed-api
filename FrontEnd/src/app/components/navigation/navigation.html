<a class="skip-link" href="#main-content">Skip to main content</a>

<nav class="navbar navbar-expand-md tm-gradient tm-navbar sticky-top"
     data-bs-theme="dark" aria-label="Main navigation">
  <div class="container">

    <a class="navbar-brand tm-brand" routerLink="/" (click)="closeMenu()">
      <span class="brand-icon" aria-hidden="true"><i class="bi bi-heart-pulse-fill"></i></span> Telemedicine
    </a>

    <button class="navbar-toggler tm-toggler" type="button"
            (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen"
            aria-controls="mainMenu"
            aria-label="Toggle navigation menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainMenu" [class.show]="menuOpen">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }"
             ariaCurrentWhenActive="page"
             (click)="closeMenu()">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/doctors"
             routerLinkActive="active"
             ariaCurrentWhenActive="page"
             (click)="closeMenu()">Find a Doctor</a>
        </li>

        @if (auth.user(); as user) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/appointments"
               routerLinkActive="active" ariaCurrentWhenActive="page"
               (click)="closeMenu()">Appointments</a>
          </li>
          <!-- logged in: who you are + log out -->
          <li class="nav-item ms-md-3 my-2 my-md-0">
            <span class="user-chip">
              <i class="bi bi-person-circle" aria-hidden="true"></i>
              {{ user.user }}
              <span class="role-badge">{{ user.role }}</span>
            </span>
          </li>
          <li class="nav-item ms-md-2">
            <button type="button" class="btn btn-light btn-sm auth-btn" (click)="logout()">
              <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Log out
            </button>
          </li>
        } @else {
          <!-- logged out: log in (remembering this page) -->
          <li class="nav-item ms-md-3">
            <a class="btn btn-light btn-sm auth-btn" routerLink="/login"
               [queryParams]="{ returnUrl: returnUrl() }" (click)="closeMenu()">
              <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Log in
            </a>
          </li>
        }
      </ul>
    </div>

  </div>
</nav>
